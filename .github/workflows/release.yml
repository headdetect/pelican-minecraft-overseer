name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, such as v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Lint
        run: find src lang config database resources tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/run.php
      - name: Build plugin zip
        id: build
        run: echo "zip=$(bin/build-zip.sh "$VERSION")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "${{ steps.build.outputs.zip }}" \
            --target "$GITHUB_SHA" \
            --title "Underseer $VERSION" \
            --generate-notes \
            $([[ "$VERSION" == *-* ]] && echo --prerelease)
