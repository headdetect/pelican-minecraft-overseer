name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Lint
        run: find src lang config database resources tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/run.php

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Built bundle matches the source
        run: |
          npm run build
          git diff --exit-code -- ../resources/dist || {
            echo "resources/dist is out of date. Run 'npm run build' in frontend/ and commit the result."
            exit 1
          }
